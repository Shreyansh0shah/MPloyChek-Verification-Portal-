<div class="admin-container">

  <div class="top-bar">

    <h2>Admin Dashboard</h2>

    <button
      mat-raised-button
      color="warn"
      (click)="logout()"
    >
      Logout
    </button>

  </div>

  <mat-form-field
    appearance="outline"
    class="search-field"
  >

    <mat-label>Search User</mat-label>

    <input
      matInput
      [(ngModel)]="searchText"
      placeholder="Search by name"
    />

  </mat-form-field>

  <mat-card class="admin-card">

    <h3>Manage Users</h3>

    <p>
      Admin can manage users and records.
    </p>

  </mat-card>

</div>
