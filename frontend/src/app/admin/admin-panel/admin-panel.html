<div class="admin-container">

  <mat-card class="admin-card">

    <h2>Admin Panel</h2>

    <div class="form-section">

      <mat-form-field appearance="outline">

        <mat-label>Name</mat-label>

        <input
          matInput
          [(ngModel)]="newUser.name"
        />

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>Email</mat-label>

        <input
          matInput
          [(ngModel)]="newUser.email"
        />

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>Role</mat-label>

        <input
          matInput
          [(ngModel)]="newUser.role"
        />

      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        (click)="addUser()"
      >
        Add User
      </button>

    </div>

  </mat-card>

  <mat-card class="users-card">

    <h2>Manage Users</h2>

    <table>

      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>

        <tr *ngFor="let user of users; let i = index">

          <td>{{ user.name }}</td>

          <td>{{ user.email }}</td>

          <td>{{ user.role }}</td>

          <td>

            <button
              mat-raised-button
              color="warn"
              (click)="deleteUser(i)"
            >
              Delete
            </button>

          </td>

        </tr>

      </tbody>

    </table>

  </mat-card>

</div>
