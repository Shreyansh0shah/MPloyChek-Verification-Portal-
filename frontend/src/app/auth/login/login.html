<ngx-spinner
  bdColor="rgba(0,0,0,0.5)"
  size="medium"
  color="#fff"
  type="ball-spin-clockwise"
>
</ngx-spinner>

<div class="login-container">
  <mat-card class="login-card">

    <h2>MPloyChek Login</h2>

    <form
      [formGroup]="loginForm"
      (ngSubmit)="onLogin()"
    >

      <mat-form-field
        appearance="outline"
        class="full-width"
      >
        <mat-label>Email</mat-label>

        <input
          matInput
          type="email"
          formControlName="email"
        />
      </mat-form-field>

      <mat-form-field
        appearance="outline"
        class="full-width"
      >
        <mat-label>Password</mat-label>

        <input
          matInput
          type="password"
          formControlName="password"
        />
      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        class="full-width"
      >
        Login
      </button>

    </form>

  </mat-card>
</div>
