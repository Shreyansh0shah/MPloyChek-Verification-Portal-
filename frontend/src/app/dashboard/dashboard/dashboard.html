<div class="dashboard-container">

  <!-- NAVBAR -->

  <div class="top-navbar">

    <h2>MPloyChek Portal</h2>

    <button
      mat-raised-button
      class="logout-btn"
      (click)="logout()"
    >
      Logout
    </button>

  </div>

  <!-- USER DETAILS -->
<mat-card class="dashboard-card">

  <div class="profile-header">

    <div class="profile-avatar">
      S
    </div>

    <div>

      <h2>Shreyansh</h2>

      <p class="role-badge">
        Admin User
      </p>

    </div>

  </div>

  <div class="details-grid">

  <div class="detail-box">

    <span class="detail-label">
      Email
    </span>

    <span class="detail-value">
      admin@test.com
    </span>

  </div>

  <div class="detail-box">

    <span class="detail-label">
      Role
    </span>

    <span class="detail-value">
      Administrator
    </span>

  </div>

  <div class="detail-box">

    <span class="detail-label">
      Department
    </span>

    <span class="detail-value">
      Verification Team
    </span>

  </div>

</div>

</mat-card>

  <!-- RECORDS -->

  <mat-card class="records-card">

    <h2>User Records</h2>

    <table>

      <thead>

        <tr>
          <th>Title</th>
          <th>Status</th>
        </tr>

      </thead>

      <tbody>

        <tr>
          <td>Background Verification</td>
          <td>Completed</td>
        </tr>

        <tr>
          <td>Document Verification</td>
          <td>Pending</td>
        </tr>

        <tr>
          <td>Employment Check</td>
          <td>Completed</td>
        </tr>

      </tbody>

    </table>

  </mat-card>

</div>
